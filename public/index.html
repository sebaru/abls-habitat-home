        <meta charset="utf-8">
        <title>Chez moi</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg==" crossorigin="anonymous">
        <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"/>
        <style>
         :root {
           --abls-navbar-height: 64px;
           --abls-navbar-image-height: 48px;
              }

         body { background-image: url('https://static.abls-habitat.fr/img/fond_home.jpg');
               background-position: center;
               background-size: cover;
               background-repeat: no-repeat;
               background-attachment: fixed;
               height: 100%;
               background-color: rgba(30,28,56,1.0);
           padding-top: var(--abls-navbar-height);
               padding-bottom: 40px;
               overflow-y: scroll;
             }

        h3 { color: white; }

        .wtd-cligno { animation-duration: 1.0s;
                      animation-name: wtdClignoFrames;
                      animation-iteration-count: infinite;
                      animation-fill-mode: backwards;
                      transition: none;
                    }
        @keyframes wtdClignoFrames
         {   0% { opacity: 1; }
            30% { opacity: 0; }
           100% { opacity: 1; }
         }

        .wtd-noshow { animation-duration: 0.3s;
                      animation-name: wtdNoShowFrames;
                      animation-iteration-count: 1;
                      animation-fill-mode: forwards;
                      transition: none;
                    }
        @keyframes wtdNoShowFrames
         {   0% { opacity: 1; }
           100% { opacity: 0; }
         }

        .card { color: white; }

        .wtd-img-grayscale
          { filter: grayscale(100%) blur(1px);
            transition: 2s;
          }

        .wtd-img-container
          { position: relative;
          }

        .wtd-img-superpose-milieu
          { position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index:2;
          }

        .wtd-img-superpose-bas-droite
          { position: absolute;
            bottom: 0px;
            right: 0px;
            transform: translate(+50%, 0%);
            z-index:2;
          }

        .wtd-img-superpose-haut-droite
          { position: absolute;
            top: 0px;
            right: 0px;
            transform: translate(+50%, 0%);
            z-index:2;
          }

        .wtd-img-superpose-haut-gauche
          { position: absolute;
            top: 0px;
            left: 0px;
            transform: translate(-50%, 0%);
            z-index:2;
          }

        .wtd-menu
          { border-radius: 20%;
            width: auto;
            max-width: var(--abls-navbar-image-height);
            height: var(--abls-navbar-image-height);
            max-height: var(--abls-navbar-image-height);
            object-fit: cover;
            cursor: pointer;
          }

        .wtd-synoptique { border-radius: 20%;
                          width: 128px;
                          height: auto;
                          cursor: pointer;
                        }

        .wtd-visuel { /*border-radius: 20%;*/
                      width: 128px;
                      height: auto;
                      max-height: 128px;
                      cursor: pointer;
                    }


        .wtd-vignette
          { width: 32px;
            height: 32px;
          }

        @media (max-width: 768px)
         { .wtd-synoptique
            { width: 96px;
              max-height: 96px;
            }
           .wtd-vignette
            { max-width: 24px;
              max-height: 24px;
            }
           .wtd-menu
             { max-width: 48px;
               max-height: 48px;
             }
           .wtd-visuel
             { max-width: 96px;
               max-height: 96px;
             }
         }

        .wtd-courbe { background-color: #777;
                      width: auto;
                      max-width: 100vw;
                      min-height: 30vh;
                      max-height: 70vh;
                      cursor: pointer;
                    }

        @media (orientation: landscape)
         {
         }

        @media (orientation: portrait)
         {
         }

        .wtd-img-card { object-fit: contain; height: 196px; max-width: 196px; padding: 10px; }

        .wtd-camera { width: 100%;
                      min-width: 320px;
                      min-height: 240px;
                      border-radius: 8px;
                      border: 2px solid rgba(255,255,255,0.2);
                    }

        input:focus { outline: 0 0 0 0  !important;
                      box-shadow: 0 0 0 0 !important;
                    }


        .navbar { background-color: rgba(30,28,56,0.95);
                }
        .navbar.fixed-top {
          min-height: var(--abls-navbar-height);
          padding-top: 0.25rem;
          padding-bottom: 0.25rem;
        }
        .navbar .container-fluid {
          min-height: calc(var(--abls-navbar-height) - 0.5rem);
          align-items: center;
        }
        .navbar .nav-link,
        .navbar .navbar-text {
          padding-top: 0.25rem;
          padding-bottom: 0.25rem;
          line-height: 1.2;
        }
        .nav-link:hover { color: white !important;
                          background-color: #48BBC0;
                        }
      </style>

    <body class="bg-dark" style="display:none">

<div class="position-fixed" style="top: 3rem; left: 50%; z-index:9999">
  <div id="idToastStatusOK" data-bs-delay="3000" class="toast hide bg-primary" role="status">
   <div class="toast-header">
     <strong class="me-auto"> Résultat de la commande</strong>
     <button type="button" class="ms-2 mb-1 btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
   </div>
   <div class="toast-body text-light">
     <i class="fas fa-check-circle"></i> <span id="idToastStatusOKLabel">Succès !</span>
   </div>
  </div>
</div>

<div class="position-fixed" style="top: 3rem; left: 50%; z-index:9999">
  <div id="idToastStatusKO" data-bs-delay="3000" class="toast hide bg-danger" role="status">
   <div class="toast-header">
     <strong class="me-auto"> Résultat de la commande</strong>
     <button type="button" class="ms-2 mb-1 btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
   </div>
   <div class="toast-body text-dark">
     <i class="fas fa-check-circle"></i> <span id="idToastStatusKOLabel">Erreur !</span>
   </div>
  </div>
</div>

<div id="idModalDel" class="modal fade" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content ">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title"><i class="fas fa-trash"></i> <span id="idModalDelTitre"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
        </button>
      </div>
      <div class="modal-body">
        <p id="idModalDelMessage"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fas fa-times"></i> Annuler</button>
        <button id="idModalDelValider" type="button" class="btn btn-danger" data-bs-dismiss="modal"><i class="fas fa-trash"></i> Valider</button>
      </div>
    </div>
  </div>
</div>

<div id="idModalInviter" class="modal fade" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header bg-info text-white">
        <h5 class="modal-title"><i class="fas fa-user-friends"></i> Inviter un ami sur le domaine</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="input-group mb-3">
          <span class="input-group-text">@</span>
          <input id="idUserInviteEmail" type="email" class="form-control" placeholder="Adresse email de l'invité">
        </div>
        <div class="input-group mb-3">
          <span class="input-group-text"><i class="fas fa-star text-primary"></i></span>
          <select id="idUserInviteAccessLevel" class="form-select"></select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fas fa-times"></i> Annuler</button>
        <button id="idUserInviteValider" type="button" class="btn btn-primary"><i class="fas fa-user-friends"></i> Inviter</button>
      </div>
    </div>
  </div>
</div>

<div id="idModalCadran" class="modal fade" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title"><i class="fas fa-edit"></i> Modifier la valeur</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <label for="idModalCadranValeur" class="form-label">Quelle est la nouvelle valeur ?</label>
        <input id="idModalCadranValeur" type="number" class="form-control" step="any">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fas fa-times"></i> Annuler</button>
        <button id="idModalCadranValider" type="button" class="btn btn-primary" data-bs-dismiss="modal"><i class="fas fa-check"></i> Valider</button>
      </div>
    </div>
  </div>
</div>

<div id="idModalError" class="modal fade" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header bg-warning">
        <h5 class="modal-title"><i class="fas fa-exclamation-circle"></i>Erreur</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
        </button>
      </div>
      <div class="modal-body">
        <p id="idModalDetail">Une erreur est survenue !</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
